<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · HeRide</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #121016;
        color: #f5f3f7;
        font-family: Manrope, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .tile {
        width: 88px; height: 88px; margin: 0 auto 28px;
        border-radius: 25px;
        background: linear-gradient(135deg, #a78bfa, #8b5cf6 45%, #7c3aed);
        display: grid; place-items: center;
        font-family: Georgia, serif; font-size: 34px; font-weight: 600; color: #14101f;
        box-shadow: 0 12px 40px rgba(139, 92, 246, 0.35);
      }
      h1 { font-family: Georgia, serif; font-weight: 600; font-size: 26px; margin: 0 0 10px; }
      p { color: #a9a2b8; font-size: 15px; line-height: 1.6; max-width: 20rem; margin: 0 auto 26px; }
      button {
        border: 0; border-radius: 16px; padding: 14px 28px;
        background: linear-gradient(135deg, #a78bfa, #8b5cf6 45%, #7c3aed);
        color: #14101f; font-weight: 700; font-size: 15px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tile">He.</div>
      <h1>You're offline</h1>
      <p>
        HeRide needs a connection to find drivers and keep your trip live. Check your data or
        Wi-Fi and try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
