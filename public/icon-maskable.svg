<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Full bleed: launchers crop maskable icons to their own shape. The glyph
       stays inside the 40%-radius safe zone so no crop can clip it. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="256" fill="#14101f" font-family="Playfair Display, Georgia, serif"
        font-weight="600" font-size="165" text-anchor="middle" dominant-baseline="central">He<tspan
        font-style="italic" fill="#14101f" fill-opacity="0.8">.</tspan></text>
</svg>
